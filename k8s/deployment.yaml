{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "devcheck",
    "labels": {
      "app": "devcheck"
    }
  },
  "spec": {
    "replicas": 2,
    "selector": {
      "matchLabels": {
        "app": "devcheck"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "devcheck"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "devcheck",
            "image": "echo-svc:0.1.0",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "env": [
              {
                "name": "APP_VERSION",
                "value": "v1"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "200m",
                "memory": "128Mi"
              }
            }
          }
        ]
      }
    }
  }
}
