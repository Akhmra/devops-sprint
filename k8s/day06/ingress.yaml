apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: lab
spec:
  rules:
    - host: app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 8080
  tls:
    - hosts:
        - app.local
      secretName: app-tls # (опционально: создайте секрет с сертификатом для HTTPS)
