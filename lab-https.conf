# nginx: TLS + reverse proxy для лаборатории дня 3.
# Создан в репозитории, чтобы попал в коммит. Рабочая копия — /etc/nginx/sites-available/lab-https.conf
server {
    listen 8443 ssl;                                  # 443 занят k3s/Traefik, 80 — рабочий сайт nginx
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/lab.crt;       # самоподписанный, только для лаборатории
    ssl_certificate_key /etc/nginx/ssl/lab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8081;             # сервис из Docker (день 15)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /echo/ {
        proxy_pass http://127.0.0.1:8091/;            # микросервис header_echo.py (блок расширения)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
